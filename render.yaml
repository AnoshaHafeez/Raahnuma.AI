services:
  - type: web
    name: raahnuma-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: raahnuma-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: raahnuma-cache
          type: keyvalue
          property: connectionString
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: keyvalue
    name: raahnuma-cache
    region: oregon
    plan: free
    ipAllowList: []   # internal-only — only your web service (same region) needs to reach it
    maxmemoryPolicy: allkeys-lru

databases:
  - name: raahnuma-db
    plan: free
    databaseName: raahnuma
    user: raahnuma
